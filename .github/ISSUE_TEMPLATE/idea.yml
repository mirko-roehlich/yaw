name: Idea
description: A change to the workflow, an agent, a skill, or the docs.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What gets in your way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What should change, and how it would help.
    validations:
      required: true
